
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChax - Social Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1>NexChax</h1>
        <input type="search" placeholder="Search NexChax...">
        <button onclick="showMessage()">Log In</button>
    </header>

    <main class="layout">

        <aside class="sidebar">
            <h3>Menu</h3>
            <p>🏠 Home</p>
            <p>👥 Friends</p>
            <p>💬 Messages</p>
            <p>🔔 Notifications</p>
            <p>👤 Profile</p>
            <p>⚙️ Settings</p>
        </aside>

        <section class="feed">

            <div class="welcome">
                <h2>Welcome to NexChax!</h2>
                <p>Connect with friends and share your world.</p>
            </div>

            <div class="post-box">
                <h3>Create a post</h3>
                <textarea id="postInput"
                    placeholder="What's on your mind?"></textarea>
                <button onclick="createPost()">Post</button>
            </div>

            <div id="posts">
                <article class="post">
                    <h3>NexChax Community</h3>
                    <p>Welcome to our new social network!</p>
                    <button onclick="likePost(this)">👍 Like</button>
                    <span>0 likes</span>
                </article>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
