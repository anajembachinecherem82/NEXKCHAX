
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChax - Connect and Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1>NexChax</h1>
    <span>Connect. Chat. Make Friends.</span>
</header>

<main class="auth-container">

    <section class="auth-card">
        <h2>Welcome to NexChax</h2>
        <p>Create an account or log in.</p>

        <h3>Create Account</h3>

        <form id="signup-form">
            <input id="signup-email" type="email"
                placeholder="Your email address" required>

            <input id="signup-password" type="password"
                placeholder="Create password (minimum 8 characters)"
                minlength="8" required>

            <button type="submit">Register</button>
        </form>

        <hr>

        <h3>Login</h3>

        <form id="login-form">
            <input id="login-email" type="email"
                placeholder="Your email address" required>

            <input id="login-password" type="password"
                placeholder="Your password" required>

            <button type="submit">Login</button>
        </form>

        <p id="auth-message" role="status"></p>
    </section>

    <section id="account-area" class="auth-card" hidden>
        <h2>Welcome to NexChax!</h2>
        <p>You are logged in as:</p>
        <p id="user-email"></p>
        <button id="logout-button">Log Out</button>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
